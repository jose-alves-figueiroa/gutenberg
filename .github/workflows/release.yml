# GitHub Release with the installers (PLAN.md → US8.5). Manual only: the installers carry the
# library texts in clear, so running this workflow is the maintainer's decision to publish them.
#
# Before running: bump "version" in package.json and close "[Não lançado]" in CHANGELOG.md as
# "## [x.y.z] — YYYY-MM-DD" (AGENTS.md → Changelog). The release is tagged v<version>, its notes
# come from that CHANGELOG section; running again for the same version replaces the files.
name: release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create as draft (visible only to collaborators until published)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  notes:
    name: release notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      # Fails early when CHANGELOG.md has no section for this version.
      - run: npm run --silent release:notes > notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md
          retention-days: 1

  installers:
    needs: notes
    uses: ./.github/workflows/installers.yml
    secrets: inherit

  release:
    needs: [notes, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: gutenberg-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: dist
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.notes.outputs.version }}
          DRAFT: ${{ inputs.draft }}
        run: |
          tag="v$VERSION"
          files=$(find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \))
          echo "$files"
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
            gh release edit "$tag" --notes-file dist/notes.md --target "$GITHUB_SHA"
          else
            flags=()
            [ "$DRAFT" = "true" ] && flags+=(--draft)
            gh release create "$tag" $files --target "$GITHUB_SHA" --title "Gutenberg $VERSION" --notes-file dist/notes.md "${flags[@]}"
          fi
